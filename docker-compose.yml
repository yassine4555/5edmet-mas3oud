version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: savingdb
    ports:
      - "5433:5433"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d savingdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    ports:
      - "5001:5001"
    environment:
      DATABASE_URL: postgresql://admin:password@db:5432/savingdb
      INTERNAL_API_KEY: nexus-internal-secret-key-123
      SECRET_KEY: your-super-secret-key-change-in-production
      DEBUG: "false"
      UPLOAD_FOLDER: /app/storage/files
    volumes:
      - ./storage:/app/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data: